<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Vad ska jag ha på mig?</title>
    <base href="/" />
    <!-- viewport-fit=cover krävs för att env(safe-area-inset-*) ska ge något på iPhone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="description" content="Lokalt väder med råd om kläder och vad som är bra att ha med sig." />
    <meta name="theme-color" content="#f3f2ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kläder i väder" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Flera storlekar med sizes, så iOS kan skala ner i stället för upp. Med
         bara 180 px blir ikonen uppskalad i de lägen som vill ha en större
         ikon, och uppskalningen lägger en mjuk grå kant runt motivet. -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="assets/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="assets/icons/icon-1024.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
