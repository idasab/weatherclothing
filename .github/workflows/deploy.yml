name: Publicera till GitHub Pages

on:
  push:
    branches: [main]
  # Gör det möjligt att köra om publiceringen manuellt från fliken Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Låt en pågående publicering bli klar innan nästa startar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 nådde end-of-life i april 2026. 22 är aktiv LTS och ligger
          # inom Angular 16:s krav (^16.14.0 || >=18.10.0).
          node-version: 22
          cache: npm

      - name: Installera beroenden
        # --include=dev är uttryckligt: Angular CLI är en devDependency, och
        # utan den finns ingen ng att bygga med.
        run: npm ci --include=dev

      # Skriver ut vad som faktiskt finns i miljön. Kostar en sekund och gör
      # nästa felsökning till en läsning i stället för en gissning.
      - name: Visa verktygen
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "ng:   $(ls -l node_modules/.bin/ng 2>&1)"
          echo "angular/cli: $(ls node_modules/@angular/cli/package.json 2>&1)"

      # Anropar CLI:n direkt i stället för via npm-skriptet, så ett saknat
      # verktyg ger ett tydligt fel i stället för exit 127 från skalet.
      - name: Bygg
        run: npx --no-install ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Ladda upp artefakten
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/weather-clothing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
