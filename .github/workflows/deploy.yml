# Bygger appen i CI och publicerar till GitHub Pages.
#
# OBS: workflowet startas bara manuellt, från fliken Actions. Det gick inte att
# få grönt på GitHub-runnern (installationssteget föll på Node 22, byggsteget på
# Node 20 med exit 127), och tills orsaken är utredd publiceras appen i stället
# från grenen gh-pages, som innehåller ett färdigbyggt resultat. Ett trasigt
# workflow som körs vid varje push ger bara röda kryss utan nytta.
#
# För att felsöka: kör det härifrån och läs stegen "Visa miljön" och
# "Kontrollera Angular CLI" — de skriver ut vad som faktiskt finns i miljön.
name: Publicera till GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 är den enda version där npm ci har lyckats här. Höj först
          # när installationssteget är bevisat på en nyare version.
          node-version: 20
          # Ingen npm-cache: en återställd cache är en felkälla vi kan utesluta
          # gratis, och installationen tar bara någon minut ändå.

      # Diagnostiken ligger före installationen, så versionerna syns i loggen
      # även när installationen är det som faller.
      - name: Visa miljön
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "os:   $(uname -a)"

      - name: Installera beroenden
        run: npm ci --include=dev --no-audit --no-fund

      - name: Kontrollera Angular CLI
        run: |
          ls -l node_modules/.bin/ng || echo "ng saknas i node_modules/.bin"
          npx --no-install ng version || true

      - name: Bygg
        run: npx --no-install ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Ladda upp artefakten
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/weather-clothing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
